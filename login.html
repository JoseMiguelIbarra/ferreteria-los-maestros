<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Iniciar sesión | Ferretería Los Maestros</title>
</head>
<body>

    <header>
        <h1>Ferretería Los Maestros</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <img src="img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-login">
            <h2>Ferretería Los Maestros - Acceso</h2>
            
            <form id="form-login" action="#" method="POST">
                <fieldset>
                    <legend>Tus credenciales</legend>
                    
                    <label for="login-correo">Correo Electrónico:</label>
                    <input type="email" id="login-correo" required maxlength="100" pattern="^[a-zA-Z0-9._%+\-]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$" title="Debe usar un correo @duoc.cl, @profesor.duoc.cl o @gmail.com">
                    
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" required minlength="4" maxlength="10">
                </fieldset>
                
                <button type="submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ferretería Los Maestros</p>
    </footer>

    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>

</body>
</html>
