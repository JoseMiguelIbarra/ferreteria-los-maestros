<body>

    <header>
        <h1>Ferretería Los Maestros</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tu cuenta de maestro ferretero.</p>
            
            <form id="form-login" action="#" method="POST" novalidate>
                <div class="input-group">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" required>
                    <span class="error-msg" id="error-login-email"></span>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" required>
                    <span class="error-msg" id="error-login-password"></span>
                </div>
                <button type="submit">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ferretería Los Maestros</p>
    </footer>

    <script src="js/validaciones.js"></script>

</body>
