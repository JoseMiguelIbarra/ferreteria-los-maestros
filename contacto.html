<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Contacto | Ferretería Los Maestros</title>
</head>
<body>

    <header>
        <h1>Ferretería Los Maestros</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto-container">
            <h2>Contáctanos</h2>
            <form id="form-contacto" action="#" method="POST">
                <fieldset>
                    <legend>Déjanos tu mensaje</legend>
                    
                    <label for="contacto-nombre">Nombre completo:</label>
                    <input type="text" id="contacto-nombre" required>
                    
                    <label for="contacto-correo">Correo Electrónico:</label>
                    <input type="email" id="contacto-correo" required maxlength="100">
                    
                    <label for="contacto-mensaje">Comentario:</label>
                    <textarea id="contacto-mensaje" required maxlength="300" rows="5" placeholder="Escribe tu mensaje aquí (Máx 300 caracteres)"></textarea>
                </fieldset>
                
                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ferretería Los Maestros</p>
    </footer>

    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>

</body>
</html>
