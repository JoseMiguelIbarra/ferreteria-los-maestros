<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilos.css">

    <script src="js/validaciones.js" defer></script>

    <title>Registro | Ferretería Los Maestros</title>
</head>

<body>

    <header>
        <h1>Ferretería Los Maestros</h1>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="carrito.html">Carrito (0)</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="titulo-registro">

            <h2 id="titulo-registro">Crear una cuenta</h2>

            <p>
                Completa tus datos para registrarte en Ferretería Los Maestros.
            </p>

            <form id="form-registro" novalidate>

                <fieldset>
                    <legend>Datos personales</legend>

                    <label for="run">RUN</label>
                    <input
                        type="text"
                        id="run"
                        name="run"
                        minlength="7"
                        maxlength="9"
                        required
                    >
                    <span id="error-run" class="error-msg"></span>

                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        maxlength="50"
                        required
                    >
                    <span id="error-nombre" class="error-msg"></span>

                    <label for="apellidos">Apellidos</label>
                    <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        maxlength="100"
                        required
                    >
                    <span id="error-apellidos" class="error-msg"></span>

                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="100"
                        required
                    >
                    <span id="error-email" class="error-msg"></span>

                    <label for="fecha-nacimiento">Fecha de nacimiento</label>
                    <input
                        type="date"
                        id="fecha-nacimiento"
                        name="fechaNacimiento"
                    >
                </fieldset>

                <fieldset>
                    <legend>Dirección</legend>

                    <label for="region">Región</label>
                    <select id="region" name="region" required>
                        <option value="">Seleccione una región</option>
                    </select>
                    <span id="error-region" class="error-msg"></span>

                    <label for="comuna">Comuna</label>
                    <select id="comuna" name="comuna" required>
                        <option value="">Seleccione una comuna</option>
                    </select>
                    <span id="error-comuna" class="error-msg"></span>

                    <label for="direccion">Dirección</label>
                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        maxlength="300"
                        required
                    >
                    <span id="error-direccion" class="error-msg"></span>
                </fieldset>

                <button type="submit">Registrarse</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ferretería Los Maestros</p>
    </footer>

</body>

</html>
