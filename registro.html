<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Registro | Ferretería Los Maestros</title>
</head>
<body>
    <header>
        <!-- Puedes copiar el mismo <nav> de los otros archivos aquí -->
        <h1>Ferretería Los Maestros</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="carrito.html">Carrito (0)</a></li>
                <!-- Resto del menú... -->
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Crear una Cuenta</h2>
            <p>Únete a nuestra comunidad de maestros ferreteros.</p>
            <form id="form-registro" action="#" method="POST" novalidate>
                <div class="input-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <span class="error-msg" id="error-nombre"></span>
                </div>
                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-msg" id="error-email"></span>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    <span class="error-msg" id="error-password"></span>
                </div>
                <button type="submit">Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ferretería Los Maestros</p>
    </footer>

    <script src="js/validaciones.js"></script>
</body>
</html>
